services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]

  redis:
    image: redis:8
    networks: [backend]

  platform-api:
    build:
      context: ..
      dockerfile: platform-api/Dockerfile
    depends_on: [postgres, rabbitmq, redis]
    networks: [backend]

  bot-gateway:
    build:
      context: ..
      dockerfile: bot-gateway/Dockerfile
    depends_on: [postgres, rabbitmq]
    networks: [backend]

  gamemate-service:
    build:
      context: ..
      dockerfile: gamemate-service/Dockerfile
    depends_on: [postgres, rabbitmq]
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  rabbitmq-data:
